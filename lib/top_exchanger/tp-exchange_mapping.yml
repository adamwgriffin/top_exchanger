# Map Office 365 Exchange fields to Top Producer fields. The keys are
# Exchange, their values are Top Producer. The value can also be a
# hash with a "map" and/or "method" key. "Map" will be an array of
# fields in case you need to concatenate them, "method" will be a method to
# call to use on the field value(s).

# All exchange fields are included as keys, even if we are not mapping
# a field to them. This is so the app can use them to build the
# headers for the import file it generates to do the exchange import.

Title: Primary Title
First Name: Primary FirstName
Middle Name: Primary Initial
Last Name: Primary LastName
